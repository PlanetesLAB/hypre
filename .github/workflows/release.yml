name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  hypre-sys:
    uses: PlanetesLAB/release-workflows/.github/workflows/release.yml@v1
    with:
      manifest: hypre-sys/Cargo.toml
      tag-prefix: hypre-sys-v
      submodules: true
      apt-packages: "libclang-dev cmake"
